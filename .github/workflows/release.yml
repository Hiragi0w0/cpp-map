name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path target/release/cpp-map.exe -Destination dist/cpp-map.exe
          $hash = (Get-FileHash -Path dist/cpp-map.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cpp-map.exe" | Set-Content -Path dist/cpp-map.exe.sha256 -NoNewline

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cpp-map.exe
            dist/cpp-map.exe.sha256
